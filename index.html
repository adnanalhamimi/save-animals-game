function tone(freq,duration,type='sine',volume=.13,delay=0){const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration)}
function sound(ok){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();if(ok){[520,660,790,990].forEach((f,i)=>{tone(f,.12,'triangle',.15,i*.095);tone(f*1.5,.055,'square',.035,i*.095+.025)})}else{tone(210,.32,'sawtooth',.15);tone(140,.4,'sawtooth',.12,.15)}}catch(e){}}
function render(i){selected=+i;select.value=selected;correct=0;attempted=new Set();let a=animals[selected];document.getElementById('photo').src=a.image;document.getElementById('name').textContent=a.name;answers.innerHTML='';status.textContent='Tap an answer!';status.style.color='#284f5b';next.disabled=true;score.textContent='Correct answers: 0 / 2';[...a.answers].map((item,j)=>({...item,originalIndex:j})).sort(()=>Math.random()-.5).forEach((item,j)=>{let b=document.createElement('button');b.className='answer';b.textContent=item.text;b.onclick=()=>choose(item.originalIndex,b);answers.append(b)})}
function choose(j,b){if(attempted.has(j)||correct===2)return;attempted.add(j);let ok=animals[selected].answers[j].correct;b.classList.add(ok?'correct':'wrong');b.textContent=(ok?'✓ ':'✕ ')+b.textContent;b.disabled=true;sound(ok);if(ok){correct++;status.textContent=correct===2?'🎉 Excellent! Both answers are correct!':'👏 Great job! Choose one more.';status.style.color='#198044'}else{status.textContent='❌ Try another answer!';status.style.color='#c53030'}score.textContent='Correct answers: '+correct+' / 2';if(correct===2){next.disabled=false;next.textContent=selected===animals.length-1?'Start Again ↻':'Next Animal →';answers.querySelectorAll('button').forEach(x=>x.disabled=true)}}
select.onchange=()=>render(select.value);document.getElementById('reset').onclick=()=>render(selected);next.onclick=()=>render((selected+1)%animals.length);render(0);
</script></body></html>
